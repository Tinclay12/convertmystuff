name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      # Approved on 2026-11-17; only the reviewed dev-only advisory is excepted.
      # The audit script fails closed after 2026-12-17 or for new/production issues.
      - run: npm run audit:security -- --allow-reviewed-dev-advisory
